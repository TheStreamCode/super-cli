version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/vscode is not a normal dependency: it declares which VS Code API
      # surface the compiler will accept, so it must stay pinned to the minimum
      # version in `engines.vscode`. Letting Dependabot raise it would silently
      # allow newer APIs to compile while the manifest still promises support for
      # older VS Code builds -- the failure would only appear at runtime, on a
      # user's machine. Raise it by hand, together with `engines.vscode`.
      - dependency-name: '@types/vscode'
    # Majors are deliberately left out of every group: they stay individual pull
    # requests so a breaking bump is never bundled with routine ones.
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
