name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v1.11.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches package version
        run: node -e "const version=require('./package.json').version; if ('v' + version !== process.env.GITHUB_REF_NAME) throw new Error('Tag and package version differ')"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Package verified VSIX
        run: npm run package

      - name: Create checksum
        run: sha256sum "vscode-super-cli-${GITHUB_REF_NAME#v}.vsix" > "vscode-super-cli-${GITHUB_REF_NAME#v}.vsix.sha256"

      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "vscode-super-cli-${GITHUB_REF_NAME#v}.vsix" \
            "vscode-super-cli-${GITHUB_REF_NAME#v}.vsix.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Super CLI $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Download and verify the released VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VSIX="vscode-super-cli-${RELEASE_TAG#v}.vsix"
          mkdir -p .release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$VSIX" \
            --dir .release
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > release-assets.json
          expected="$(jq -r --arg name "$VSIX" '.assets[] | select(.name == $name) | .digest' release-assets.json)"
          test -n "$expected"
          test "$expected" != "null"
          actual="sha256:$(sha256sum ".release/$VSIX" | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Publish to Visual Studio Marketplace
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npx --yes @vscode/vsce@4.1.0 publish \
            --packagePath ".release/vscode-super-cli-${RELEASE_TAG#v}.vsix" \
            --oidc --skip-duplicate

      - name: Publish to Open VSX
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npx --yes ovsx@1.3.0 publish \
            --packagePath ".release/vscode-super-cli-${RELEASE_TAG#v}.vsix" \
            --trusted-publishing --skip-duplicate
